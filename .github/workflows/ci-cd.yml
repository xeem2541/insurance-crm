name: Apple Insurance CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      # Uncomment when you have ESLint configured
      # - name: Run Linting
      #   run: npm run lint

      # Ensure tests are passing. Will halt deployment if tests fail.
      - name: Run Unit Tests
        run: npm test -- --passWithNoTests
        
  deploy-staging:
    name: Deploy to Staging Environment
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Example of executing deployment via SSH to a VPS
      # Adjust secrets and host for your actual staging environment
      - name: Execute Remote Deploy Script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/apple-insurance/backend
            git checkout staging
            git pull origin staging
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh staging

  deploy-production:
    name: Deploy to Production Environment (Zero-Downtime)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Example of executing deployment via SSH to a VPS
      # Adjust secrets and host for your actual production environment
      - name: Execute Remote Deploy Script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/apple-insurance/backend
            git checkout main
            git pull origin main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh production
