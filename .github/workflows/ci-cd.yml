name: Apple Insurance CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      # Uncomment when you have ESLint configured
      # - name: Run Linting
      #   run: npm run lint

      # Ensure tests are passing. Will halt deployment if tests fail.
      - name: Run Unit Tests
        run: npm test -- --passWithNoTests
        

